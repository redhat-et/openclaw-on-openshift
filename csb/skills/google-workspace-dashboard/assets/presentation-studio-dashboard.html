<main aria-labelledby="studio-title">
  <header>
    <p class="eyebrow">From idea to review</p>
    <h1 id="studio-title">Presentation Studio</h1>
    <p class="muted">Draft and review a self-contained HTML deck inside this Claw.</p>
  </header>

  <section class="actions" aria-label="Presentation actions">
    <button class="card primary" type="button" data-action="new-deck">
      <span class="icon" aria-hidden="true">＋</span>
      <span><strong>Create a presentation</strong><small>Start with the audience, decision, and source material</small></span>
    </button>

    <button class="card" type="button" data-action="review-deck">
      <span class="icon" aria-hidden="true">✓</span>
      <span><strong>Review a presentation</strong><small>Check narrative, evidence, readability, and visual QA</small></span>
    </button>

  </section>

  <p id="status" class="status muted" role="status" aria-live="polite">Ready when you are.</p>
  <p class="privacy"><span aria-hidden="true">●</span> HTML previews stay inside the Claw and have no network capabilities.</p>
</main>

<style>
  * { box-sizing: border-box; }
  main { display: grid; gap: 18px; padding: 4px; color: var(--text); }
  header { display: grid; gap: 5px; }
  h1, p { margin: 0; }
  h1 { color: var(--text-strong); font-size: 1.45rem; line-height: 1.2; }
  .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .muted { color: var(--muted); }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  button.card { display: flex; min-height: 94px; gap: 12px; align-items: center; margin: 0; padding: 16px; text-align: left; cursor: pointer; }
  button.card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  button.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.card:disabled { cursor: wait; opacity: .7; transform: none; }
  button.card.primary { background: var(--accent-fill); color: var(--accent-fg); border-color: transparent; }
  button.card.primary strong, button.card.primary small { color: inherit; }
  button span:last-child { display: grid; gap: 4px; }
  button strong { color: var(--text-strong); font-size: .98rem; }
  button small { color: var(--muted); font-size: .78rem; line-height: 1.35; }
  .icon { display: grid; flex: 0 0 34px; width: 34px; height: 34px; place-items: center; border: 1px solid currentColor; border-radius: 10px; font-size: 1rem; }
  .status { min-height: 1.3em; font-size: .82rem; }
  .privacy { color: var(--ok); font-size: .78rem; }
  .privacy span { font-size: .6rem; vertical-align: 1px; }
  @media (max-width: 560px) { .actions { grid-template-columns: 1fr; } }
</style>

<script>
  const previewRules = " Ask only for missing audience, decision, length, source, template, and deadline details. Map material claims to approved sources and label assumptions. Produce a self-contained HTML slide presentation as a sandboxed widget on the presentations tab with keyboard and button navigation, readable contrast, slide numbers, and no network capabilities. Inspect the rendered presentation for overflow, clipping, contrast, and placeholders before calling it ready.";
  const prompts = {
    "new-deck": "Help me create a presentation. Start with a concise narrative and source map, then create a reviewable HTML slide preview inside this Claw." + previewRules,
    "review-deck": "Ask me for the presentation preview to review. Review audience fit, decision narrative, source traceability, unsupported claims, layout, contrast, clipping, and speaker notes. Do not modify the source deck."
  };

  const status = document.querySelector("#status");
  document.querySelectorAll("button[data-action]").forEach((button) => {
    button.addEventListener("click", () => {
      const prompt = prompts[button.dataset.action];
      if (!prompt) return;
      button.disabled = true;
      status.textContent = "Presentation request sent to your Claw.";
      if (window.openclaw?.prompt?.send) window.openclaw.prompt.send(prompt);
      else sendPrompt(prompt);
      window.setTimeout(() => {
        button.disabled = false;
        status.textContent = "Ready when you are.";
      }, 1200);
    });
  });
</script>
